name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - name: Publish unless this version is already on npm
        run: |
          pkg=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$pkg" version >/dev/null 2>&1; then echo "$pkg is already on npm."; exit 0; fi
          npm publish --provenance --access public
